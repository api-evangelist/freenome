aid: freenome
name: Freenome
description: >-
  Freenome is an early cancer detection company founded in 2014 that develops
  blood-based screening tests to catch cancer in its earliest, most treatable
  stages. It combines multiomics laboratory science with artificial intelligence
  and machine learning to read multiple biological signals from a single blood
  draw, an approach it calls Personalized Cancer Detection. Its SimpleScreen
  portfolio includes tests for colorectal and lung cancer, validated through
  clinical research programs such as the PREEMPT CRC study. Freenome is a
  clinical diagnostics and life-sciences company; it does not currently publish
  a public developer API, SDK, or partner integration surface. This profile was
  added to the API Evangelist network as a venture-portfolio lead (backed by
  a16z, CRV, DCVC, and GV) and enriched with the public identity, legal, and
  domain-security signals available from its website.
